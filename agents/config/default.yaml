# Configuration for the PA_PB1 agent system.
#
# This file IS loaded: agents/core/config.py reads it at import time, and
# agents/core/execution.py and agents/core/definitions/* take their defaults
# from it. Because it is read at import, the values here are what appear as
# defaults in the tool schemas the LLM is shown.
#
# Editing it changes behaviour on the next run. Point PA_PB1_AGENTS_CONFIG at
# another file to override it without touching this one.
#
# Every key below is mirrored by DEFAULTS in agents/core/config.py, which is
# the merge base: deleting a key here restores the built-in value rather than
# breaking anything, and a key this file omits is simply inherited.
#
# Read-only at runtime: agents cannot modify this file, and no tool exposes it.

llm:
  # Passed to slapsci's get_llm_provider(provider, model).
  provider: anthropic
  model: claude-sonnet-4-6
  # Per-agent overrides. The architect benefits most from a stronger model
  # because its output is a design decision rather than a lookup.
  per_agent:
    architect: null
    trainer: null
    generator: null
    orchestrator: null

execution:
  # Julia project to activate. Relative to the repository root.
  julia_project: PD_energy_model
  julia_bin: julia
  timeout_s: 3600
  # Phase 2: set to "slurm" once SlurmRunner is implemented.
  backend: local

defaults:
  seq_length: 15
  # Cysteine excluded to avoid spurious disulfides in designed peptides.
  forbidden_aa: "C"
  # The energy model is a cost: lower is better. See schemas.py.
  objective: minimize

sampling:
  n: 50
  temperature: 1.0
  n_steps: 1000
  # Below this mean pairwise Hamming distance, treat the run as collapsed.
  min_mean_hamming: 3.0

data:
  # Repo-relative, and all three exist. Informational for now: no tool reads
  # these yet, they record where the canonical inputs live. The examples in
  # agents/examples/ use the same paths.
  seed_sequences: data/input_sequences.txt
  affinity_measurements: data/affinity_measurements_PA-PB1_formatted.csv
  reference_weights_dir: data/energy_model_params
